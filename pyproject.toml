[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-procedural-skill-crystallizer"
version = "0.1.0"
description = "Trajectory mining tool extracting recurring successful tool-invocation sequences into reusable procedural macros"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-procedural-skill-crystallizer = "agent_procedural_skill_crystallizer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_procedural_skill_crystallizer*"]
